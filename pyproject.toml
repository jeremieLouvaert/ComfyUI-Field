[project]
name = "comfyui-field"
description = "Resolution-independent procedural fields for driving and masking effects. Perlin, simplex, value and Worley noise as pure functions of normalised coordinates, with a probability-integral-transform coverage control; threshold, morphology, exact Euclidean distance and combine nodes for shaping them; fields derived from the image itself via luma, edges and local contrast; and a mask-driven compositor that makes any global effect spatially varying."
version = "0.4.0"
